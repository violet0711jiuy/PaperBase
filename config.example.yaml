# PaperBase 的非敏感、可调运行参数。
# 路径可使用相对路径（相对本文件所在的项目根目录）或绝对路径；API Key、Token 等敏感信息只放在 .env。

# 项目的基础标识信息。
project:
  # 项目名称：用于日志、检查产物等位置标识当前项目。
  name: PaperBase

# 项目本地数据的统一存储位置。
storage:
  # 原始论文 PDF 的存放目录。
  papers_dir: storage/papers
  # 解析后的 Markdown、检查报告等产物目录。
  parsed_dir: storage/parsed
  # 可重新生成的中间产物目录，例如 embedding 文件。
  staging_dir: storage/staging

# Step 1：论文解析相关配置。
parsing:
  # 解析器后端标识；未来接入其他解析工具时可在此切换。
  backend: docling
  # 供人工检查的解析产物输出目录。
  inspection_output_dir: storage/parsed/granite_docling

  # 论文前置元数据（标题、作者、摘要、关键词等）的识别配置。
  front_matter:
    # 是否启用前置元数据的统一识别与整理。
    enabled: true
    # 最多扫描前几页以识别论文前置元数据。
    max_pages: 2

  # Docling 解析器专用配置。
  docling:
    # 已下载的 Docling 本地模型目录。
    artifacts_path: models/docling
    # 模型推理设备；cuda 表示使用 NVIDIA GPU。
    device: cuda
    # 是否对扫描版或无文本层 PDF 启用 OCR。
    enable_ocr: false
    # 是否启用公式增强识别。
    enable_formula_enrichment: true
    # 公式增强所使用的预设模型。
    formula_preset: granite_docling
    # 是否编译版面分析模型；Windows 当前保持关闭以避免编码兼容问题。
    compile_layout_model: false
    # 是否编译公式模型；Windows 当前保持关闭以避免编码兼容问题。
    compile_formula_model: false
    # 是否从正文 Markdown 中移除 Docling 已明确标注的页眉和页脚。
    remove_page_furniture: true
    # 是否清理 PDF 中与正文重叠的匿名审稿标记等无效文本碎片。
    remove_peer_review_artifacts: true
    # 将疑似列表项而非标题的长“1) ...”文本恢复为列表项时使用的最小字符数阈值。
    list_style_heading_min_chars: 80
    # 启用 Docling 原生章节层级推断；它依次使用 PDF 书签、标题编号和字体样式。
    enable_heading_hierarchy: true
    # 有 PDF 书签时优先使用其声明的目录层级。
    heading_hierarchy_use_bookmarks: true
    # 无可靠书签时，使用如 3、3.1、3.1.1 的标题编号推断层级。
    heading_hierarchy_use_numbering: true
    # 无书签和编号时，使用标题字体样式作为 Docling 原生兜底。
    heading_hierarchy_use_style: true
    # Docling 允许的最大章节深度；更深层级会由它自身截断。
    heading_hierarchy_max_level: 6

# Step 2：结构感知分块配置。
chunking:
  # 分块器后端标识。
  backend: docling_hybrid
  # 每个 embedding_text 的最大 token 数。
  max_tokens: 512
  # 为标题、章节等嵌入元数据预留的 token 数。
  embedding_metadata_reserve_tokens: 64
  # 用于 token 计数的本地 tokenizer 路径，不会在此步骤加载完整 embedding 模型。
  tokenizer_path: models/Qwen3-Embedding-0.6B
  # 供人工检查的分块 JSONL 与报告输出目录。
  inspection_output_dir: storage/parsed/chunks/qwen3_embedding_0_6b
  # 跨页表格分块时是否在后续块中重复表头。
  repeat_table_header: true
  # 是否在 token 上限允许时合并相邻、同层级的分块。
  merge_peers: true

# Step 3：SQLite 元数据数据库配置。
database:
  # SQLite 数据库文件路径；其中存储论文、分块、元数据和 FTS 索引。
  path: storage/paperbase.sqlite3
  # SQLite 遇到短暂锁定时的最长等待时间，单位为毫秒。
  busy_timeout_ms: 5000

# 多轮聊天状态独立保存，rebuild.py 不会读取、删除或重建该数据库。
conversation:
  path: storage/conversations.sqlite3
  # 每次 Query Resolution 最多读取的最近完整 User + Assistant 回合数。
  max_context_turns: 4
  busy_timeout_ms: 5000

# Step 4：向量生成配置。
embedding:
  # embedding 模型适配器后端标识。
  backend: qwen_sentence_transformers
  # 模型的 Hugging Face 标识，用于记录模型来源与版本语义。
  model_id: Qwen/Qwen3-Embedding-0.6B
  # 本地 embedding 模型目录，修改为自己本地的embedding路径
  model_path: models/Qwen3-Embedding-0.6B
  # 生成向量时使用的推理设备。
  device: cuda
  # 单批次送入 embedding 模型的文本数量；可按显存情况调整。
  batch_size: 16
  # 是否对向量做 L2 归一化，以便内积等价于余弦相似度。
  normalize_embeddings: true
  # vectors.npy、records.jsonl、manifest.json 等可重建中间产物的输出目录。
  output_dir: storage/staging/embeddings/qwen3_embedding_0_6b

# Step 5：FAISS 向量索引配置。
indexing:
  # FAISS 索引后端；flat_ip 表示精确内积检索。
  backend: faiss_flat_ip
  # 正式 FAISS 向量索引文件路径。
  index_path: storage/paperbase.faiss
  # FAISS 索引清单文件路径，用于校验索引与 SQLite 的对应关系。
  manifest_path: storage/paperbase.faiss.manifest.json

# Step 7：本地 Cross-Encoder 重排序配置。
reranking:
  # 重排序器后端标识；未来可替换为其他本地或远程重排序模型。
  backend: bge_cross_encoder
  # 是否启用正文候选的重排序；关闭时保留 Step 6 的 RRF 排序。
  enabled: true
  # 模型的 Hugging Face 标识，用于记录模型来源与版本语义。
  model_id: BAAI/bge-reranker-v2-m3
  # 已下载的本地重排序模型目录。
  model_path: models/bge-reranker-v2-m3
  # 重排序推理设备；cuda 表示使用 NVIDIA GPU。
  device: cuda
  # 单批次输入模型的“问题 + 正文 chunk”配对数量；可按显存情况调整。
  batch_size: 8
  # 每个问题最多送入重排序器的正文 RRF 候选数量。
  candidate_top_k: 40
  # 未指定命令行 --top-k 时，最终默认保留的正文证据数量。
  final_top_k: 5
  # 每个“问题 + chunk”配对的最大 token 数，超出部分在 chunk 尾部截断。
  max_length: 1024
  # 是否将原始 logit 经过 sigmoid 转换为 0 到 1 的可读相关性分数。
  normalize_scores: true

# Step 8：以“同论文、同章节、连续 chunk”为边界补齐 Reranker 命中的上下文。
context_expansion:
  # 是否启用相邻 chunk 扩展；关闭后仅将 Reranker 返回的原始 chunk 作为回答证据。
  enabled: true
  # 命中 chunk 左右各最多扩展几个连续 chunk；1 表示可组成“前一块 + 命中块 + 后一块”。
  neighbor_window: 1
  # 所有正文证据组可送入回答模型的最大 token 预算；只保留完整 chunk，不从中间截断。
  max_total_tokens: 6000

# Step 8：基于已扩展证据生成最终回答的运行开关。
answer_generation:
  # 是否调用 LLM 生成带证据标识的回答；关闭时仍输出可审阅的检索与扩展证据。
  enabled: true
  # 最多向回答模型提供多少个证据单元；正文证据和参考文献证据共同计数。
  max_evidence_units: 8
  # Reranker 成功但所有正文分数都低于此值时，不让无关 chunk 进入 Answer LLM。
  min_rerank_score: 0.05
  # 最终阅读式回答的独立输出上限；不再受全局 LLM_MAX_TOKENS=500 限制。
  max_output_tokens: 1600

# v0.2 Step 2：单篇临时论文速览。只读取 temporary workspace 的 parsed/chunks 产物，
# 先按字段选择候选 evidence，再合并、去重并应用全局 token 预算；不执行 FAISS 检索。
paper_overview:
  # 摘要最多保留两块，避免摘要重复挤占方法和结果的 token 预算。
  max_abstract_chunks: 2
  # 每个 Overview 字段进入候选 evidence 阶段的最大 chunk 数。
  research_problem_candidate_limit: 3
  contributions_candidate_limit: 3
  main_method_candidate_limit: 4
  datasets_candidate_limit: 2
  experimental_setup_candidate_limit: 3
  main_results_candidate_limit: 4
  limitations_candidate_limit: 3
  # 单 chunk 与整份 Overview Context 的 token 预算。
  max_tokens_per_chunk: 480
  max_total_context_tokens: 4800
  # 标题无法归入核心类别时，从最早正文 chunk 中保留的受控兜底数量。
  max_fallback_chunks: 2
  # Overview 结构化 JSON 的独立输出预算；不影响 Query Rewrite 或知识库 QA。
  max_output_tokens: 3000

# v0.2 Explain Section：只读取一个 temporary workspace 的 Section Tree 与直属 chunk 归属，
# 不经过正式知识库检索。父章节在 target 预算中优先覆盖各子树，任何输入不超过 max 上限。
explain_section:
  max_tokens_per_chunk: 700
  target_context_tokens: 5000
  max_context_tokens: 8000
  max_representative_chunks_per_branch: 3
  max_key_points: 5
  max_output_tokens: 2500

# Step 6：Query Planning、Dense 和 FTS5/BM25 混合检索配置。
retrieval:
  # 检索器后端标识。
  backend: hybrid_rrf
  # 每条 Dense 查询路径召回的候选数量。
  dense_top_k_per_query: 20
  # 英文关键词 BM25 检索时召回的候选数量。
  bm25_keywords_top_k: 20
  # RRF 融合、去重后送入重排阶段之前保留的候选数量。
  fused_top_k: 50
  # Reciprocal Rank Fusion 的平滑常数。
  rrf_k: 60
  # resolved_query Dense 路径在加权 RRF 中的权重。
  dense_resolved_weight: 0.8
  # semantic_query_en Dense 路径在加权 RRF 中的权重。
  dense_semantic_weight: 1.2
  # 英文关键词 BM25 路径在加权 RRF 中的权重。
  bm25_keywords_weight: 1.2
  # Qwen embedding 在查询侧使用的任务指令，不会写入论文文本或发送给生成 LLM。
  query_instruction: >
    Given a Chinese or English academic question, retrieve relevant passages
    from a collection of scientific papers that answer the question.

  # Query Resolution 与 Retrieval Rewrite 的开关和候选控制参数。
  query_rewrite:
    # 是否启用 LLM Query Resolution 与英文 Retrieval Rewrite。
    enabled: true
    # LLM 输出中保留的英文词法检索关键词最大数量。
    max_lexical_keywords_en: 5
    # 明确询问引用或参考文献时，额外从 bibliography FTS5 返回的候选数量。
    bibliography_top_k: 5
