# PaperBase 的非敏感、可调运行参数。
#
# 路径可使用相对路径（相对于本文件所在的项目根目录）或绝对路径。模型缓存继续
# 固定使用 D 盘，不要把模型目录改到 C 盘。API Key、Token 等敏感信息未来放在 .env，
# 不写入本文件，也不提交到 Git。

project:
  name: PaperBase

# 所有业务数据目录集中在这里。后续 SQLite、FAISS、评测等模块会继续在本文件增加
# 对应的小节，而不是在业务代码中分散硬编码路径与参数。
storage:
  papers_dir: storage/papers
  parsed_dir: storage/parsed
  staging_dir: storage/staging

parsing:
  # 解析器选择项。当前已实现 docling；未来接入 MinerU 等工具时，只需增加适配器和
  # 对应的配置小节，再将此值改为新的解析器标识。
  backend: docling

  # 解析检查产物（Markdown、原生 JSON、检查报告）的输出位置。保留公式模型名称，
  # 便于未来比较不同解析器或模型的同一篇论文结果。
  inspection_output_dir: storage/parsed/granite_docling

  # 论文首页的作者、单位、摘要、关键词和出版信息不应依赖出版社是否把它们标成正文
  # section。Parser 会以受控标签、首页位置和内容特征输出统一 front_matter 语义块。
  # 该配置属于解析器无关的 ParsedPaper 契约；未来替换 MinerU 等工具时仍继续使用。
  front_matter:
    enabled: true
    max_pages: 2

  docling:
    # 已下载的 Docling 本地模型目录。必须保留在 D 盘的统一模型缓存中。
    artifacts_path: D:/AI_Workspace/AI_Models/docling_models
    device: cuda

    # 当前论文为可提取文本的数字 PDF，因此关闭 OCR；扫描版论文需要在单独验证后再开。
    enable_ocr: false

    # 保留当前已验证的公式识别配置。该选项并不能保证所有行内公式正确，具体限制仍需
    # 通过 inspection 报告和 Markdown 抽样检查。
    enable_formula_enrichment: true
    formula_preset: granite_docling

    # Windows 下编译模型会触发 GBK 编码问题，当前必须保持关闭。
    compile_layout_model: false
    compile_formula_model: false

    # 解析器会把被 Docling 明确标注的页眉、页脚从 Markdown 与后续分块中移除；期刊名、
    # 卷期等非页码信息会保存到 ParsedPaper.page_furniture 供来源展示或存储层使用。
    remove_page_furniture: true

    # 有些 PDF 带有不可见的审稿文本层。本开关只清理同时含 FOR PEER REVIEW 标记、且
    # 位于完全相同坐标带的碎片；没有充分证据的重复正文不会被自动删除。
    remove_peer_review_artifacts: true

    # 超长 ``1) ...`` 项若还被紧随正文中的 ``2) ...`` 连续项证实为列表，会在 Parser
    # 阶段从错误的 section_header 转回 ListItem。短括号编号标题不会改写。
    list_style_heading_min_chars: 80

# Step 2：结构感知分块。token 上限使用之后真正生成向量的 Qwen tokenizer 计数，而非
# Docling 默认 MiniLM tokenizer；这样不会触发 C 盘缓存下载，也避免两个模型的切词差异。
chunking:
  backend: docling_hybrid

  # embedding_text 的总长度上限。HybridChunker 会预留下面的标题/章节元数据预算，
  # 因此正文分块的实际预算为 512 - 64 = 448 tokens。
  max_tokens: 512
  embedding_metadata_reserve_tokens: 64

  # Qwen3-Embedding-0.6B 已下载到 D 盘。本阶段只加载其 tokenizer，不加载模型权重，
  # 所以不占用 GPU 显存；Step 4 才会用同一路径加载 embedding 模型。
  tokenizer_path: D:/AI_Workspace/AI_Models/hf_models/Qwen3-Embedding-0.6B

  # 仅供人工检查的分块 JSONL 与报告。它不是正式 metadata 存储；SQLite 在 Step 3 引入。
  inspection_output_dir: storage/parsed/chunks/qwen3_embedding_0_6b

  # 跨页表格分块时重复表头，避免孤立的后续行失去列语义；相邻同级项目允许合并，
  # 由 HybridChunker 在 token 上限内决定，不使用固定字符数切分。
  repeat_table_header: true
  merge_peers: true

# Step 3：正式元数据存储。SQLite 是一个本地单文件数据库，不需要下载、安装或启动
# 服务端；此处只存论文、前置元数据和 chunk，绝不把 PDF 二进制或后续的向量写入其中。
database:
  path: storage/paperbase.sqlite3

  # 多次导入不会并发执行，但为以后 Streamlit 上传与查询同时发生的场景保留短暂等待。
  busy_timeout_ms: 5000

# Step 4：仅生成可审计的本地 embedding 产物。向量不写入 SQLite；Step 5 建立统一
# FAISS 索引成功后，才会为 chunks.vector_id 分配正式 ID。
embedding:
  # 通过 backend 工厂选择适配器。未来替换模型时新增适配器与配置，而不是改业务调用方。
  backend: qwen_sentence_transformers
  model_id: Qwen/Qwen3-Embedding-0.6B
  model_path: D:/AI_Workspace/AI_Models/hf_models/Qwen3-Embedding-0.6B
  device: cuda

  # RTX 5060 8GB 显存下从保守的 16 开始；如实测显存充足可逐步增大，不影响已有向量含义。
  batch_size: 16
  normalize_embeddings: true

  # 产物包括 vectors.npy、records.jsonl、manifest.json，属于可重建的 staging 数据，
  # 不应当作为 Git 源码提交。
  output_dir: storage/staging/embeddings/qwen3_embedding_0_6b

# Step 5：唯一的正式知识库向量索引。FAISS 只保存向量与 vector_id；论文和 chunk
# metadata 仍由 SQLite 保存。当前先实现全库首次建库，增量加入由后续入库服务负责。
indexing:
  backend: faiss_flat_ip
  index_path: storage/paperbase.faiss
  manifest_path: storage/paperbase.faiss.manifest.json
